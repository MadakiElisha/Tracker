# ByteTrack for the drone tracker (tracking.tracker_config / --tracker-config).
# Same as Ultralytics' bytetrack.yaml except track_buffer, and meant to be used with
# tracking.detector_conf 0.1 so ByteTrack's second stage (detections 0.1-0.25) can keep a
# small, distant target's track alive instead of it being re-created under a new id.
tracker_type: bytetrack
track_high_thresh: 0.25   # first-stage match
track_low_thresh: 0.1     # second-stage match: weak detections keep existing tracks alive
new_track_thresh: 0.25    # only confident detections start new tracks
track_buffer: 45          # frames a lost track is kept: 1.5 s at 30 fps (default 30 = 1.0 s at 30 fps)
match_thresh: 0.8
fuse_score: True
